name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest setup-python offers for this image; 3.9 and 3.8 are not
        # built for it, which is why the README does not claim them.
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: The script runs as a script
        run: |
          python timings.py --help > /dev/null
          python timings.py history --db ci.db
          python timings.py eta --class nothing --run 1 --db ci.db
