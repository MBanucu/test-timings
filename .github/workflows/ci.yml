name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest setup-python offers for this image; 3.9 and 3.8 are not
        # built for it, which is why the README does not claim them.
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: The file runs as a script
        run: |
          python test_timings.py --help > /dev/null
          python test_timings.py history --db ci.db
          python test_timings.py eta --class nothing --run 1 --db ci.db

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python -m pip install build && python -m build
      # The tests run against the checkout; this runs what pip gives a user.
      - name: Install the wheel and run it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/test-timings" --version
          "$RUNNER_TEMP/venv/bin/test-timings" history --db "$RUNNER_TEMP/ci.db"
          "$RUNNER_TEMP/venv/bin/python" -c "import test_timings; print(test_timings.__file__)"
      - name: Install the sdist and run it
        run: |
          python -m venv "$RUNNER_TEMP/venv-sdist"
          "$RUNNER_TEMP/venv-sdist/bin/pip" install --quiet dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv-sdist/bin/test-timings" --version
