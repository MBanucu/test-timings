name: Release

# Publishes to PyPI when a version tag is pushed. The upload authenticates with
# PyPI's trusted publishing, so there is no token in this repository: PyPI is
# configured to trust this workflow in this repository for the `pypi`
# environment, and the job's OIDC identity is what it checks. The first release
# needs a pending publisher for the name on PyPI (see the README).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The version lives in test_timings.py, not in the tag or in pyproject: a
      # tag that disagrees with it would publish a file whose --version lies.
      - name: The tag matches the module
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(python -c 'import test_timings; print(test_timings.__version__)')
          if [ "$want" != "$got" ]; then
            echo "tag $GITHUB_REF_NAME but test_timings.__version__ is $got" >&2
            exit 1
          fi
          echo "publishing $got"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build
        run: python -m pip install build && python -m build

      # The wheel is what users get, so it is installed from the file that will
      # be uploaded, in a directory that has no checkout to fall back on.
      - name: Install the wheel and run it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/test-timings" --version
          "$RUNNER_TEMP/venv/bin/test-timings" history --db "$RUNNER_TEMP/ci.db"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
